name: Dukascopy XAUUSD provider probe

on:
  push:
    branches:
      - feature/multi-timeframe-engine
    paths:
      - ".github/workflows/dukascopy-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned Dukascopy downloader
        run: npm install --global dukascopy-node@1.51.1

      - name: Install Chromium for provider challenge recovery
        run: dukascopy-node --install-browser --with-deps

      - name: Set a rolling 32-day UTC window
        run: |
          echo "FROM_DATE=$(date -u -d '32 days ago' +%F)" >> "$GITHUB_ENV"
          echo "TO_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Download XAUUSD bid candles on all strategy timeframes
        run: |
          set -euo pipefail
          mkdir -p download
          for tf in m5 m15 h1 h4; do
            dukascopy-node -i xauusd -from "$FROM_DATE" -to "$TO_DATE" -t "$tf" -f csv -dir ./download --retries 2 --batch-pause 1000 --cache
          done

      - name: Validate coverage, freshness and OHLC integrity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = './download';
          const now = Date.now();
          const rules = {
            m5: { minRows: 3000, maxAgeHours: 72 },
            m15: { minRows: 1000, maxAgeHours: 96 },
            h1: { minRows: 200, maxAgeHours: 120 },
            h4: { minRows: 50, maxAgeHours: 168 },
          };
          for (const [tf, rule] of Object.entries(rules)) {
            const file = fs.readdirSync(dir).find(n => n.startsWith(`xauusd-${tf}-bid-`) && n.endsWith('.csv'));
            if (!file) throw new Error(`Missing ${tf} CSV`);
            const lines = fs.readFileSync(path.join(dir, file), 'utf8').trim().split(/\r?\n/);
            if (lines.length < rule.minRows + 1) throw new Error(`${tf}: only ${lines.length - 1} rows`);
            const rows = lines.slice(1).map(line => line.split(',').map(Number));
            let previous = 0;
            for (const row of rows) {
              const [ts, open, high, low, close] = row;
              if (![ts, open, high, low, close].every(Number.isFinite)) throw new Error(`${tf}: non-numeric OHLC row`);
              if (ts <= previous) throw new Error(`${tf}: timestamps not strictly increasing`);
              if (ts > now + 24 * 3600 * 1000) throw new Error(`${tf}: future timestamp`);
              if (high < Math.max(open, close, low) || low > Math.min(open, close, high)) throw new Error(`${tf}: invalid OHLC relationship`);
              previous = ts;
            }
            const ageHours = (now - previous) / 3600000;
            if (ageHours > rule.maxAgeHours) throw new Error(`${tf}: stale latest candle (${ageHours.toFixed(1)}h)`);
            console.log(`${tf}: rows=${rows.length}, latest_utc=${new Date(previous).toISOString()}, age_hours=${ageHours.toFixed(1)}, file=${file}`);
          }
          console.log('DUKASCOPY_PROVIDER_PROBE_OK');
          NODE

      - name: Preserve probe CSVs for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-xauusd-probe-${{ github.run_id }}
          path: download/*.csv
          retention-days: 3
