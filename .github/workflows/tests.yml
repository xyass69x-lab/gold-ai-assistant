name: Python tests

on:
  push:
    branches: ["main", "autonomous-gold-engine", "feature/multi-timeframe-engine"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run all tests
        env:
          DATABASE_PATH: /tmp/gold-ai-assistant-tests/signals.db
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Verify AlgoSpecial historical feed and run walk-forward backtest
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app.backtest_mtf import run_backtest_report
          print(run_backtest_report())
          PY
