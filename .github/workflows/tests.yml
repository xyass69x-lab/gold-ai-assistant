name: Python tests

on:
  push:
    branches: ["main", "autonomous-gold-engine", "feature/multi-timeframe-engine"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run all tests
        env:
          SAFE_TEST_MODE: "true"
          DATABASE_PATH: /tmp/gold-ai-assistant-tests/signals.db
        run: pytest -q
